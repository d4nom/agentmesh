name: agentmesh

x-agent-env: &agent-env
  SYSTEM_CONFIG: /app/configs/${SYSTEM_CONFIG_FILE:-incident_triage.yaml}
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}

x-agent-common: &agent-common
  image: agentmesh/agent:latest
  pull_policy: never
  restart: unless-stopped
  stop_grace_period: 16m
  init: true
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/healthy && find /tmp/healthy -newermt '-30 seconds' | grep -q ."]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  depends_on:
    nats:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  agent-image:
    build: .
    image: agentmesh/agent:latest
    profiles: ["build"]
    entrypoint: ["/bin/true"]

  nats:
    image: nats:2.14.3-alpine
    command: ["-js", "-m", "8222"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seed:
    image: agentmesh/agent:latest
    pull_policy: never
    entrypoint: ["python", "scripts/seed_runbooks.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  parser:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: parser
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  rag:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: rag
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  executor:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: executor
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  summarizer:
    <<: *agent-common
    profiles: ["with-summary"]
    environment:
      <<: *agent-env
      AGENT_NAME: summarizer
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Second domain: maintenance-request pipeline. Own agent names, own subjects,
  # own Qdrant collection — a parallel pipeline, not a variant of the first
  # one, so SYSTEM_CONFIG is pinned here rather than following
  # SYSTEM_CONFIG_FILE (which the incident-triage services above use) —
  # running `--profile maintenance` always also starts the default-profile
  # services, and they must keep loading their own config regardless of what
  # this profile needs.
  seed-compliance:
    image: agentmesh/agent:latest
    pull_policy: never
    profiles: ["maintenance"]
    entrypoint: ["python", "scripts/seed_compliance.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

  request-parser:
    <<: *agent-common
    profiles: ["maintenance"]
    environment:
      <<: *agent-env
      SYSTEM_CONFIG: /app/configs/maintenance_request.yaml
      AGENT_NAME: request-parser
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  compliance-rag:
    <<: *agent-common
    profiles: ["maintenance"]
    environment:
      <<: *agent-env
      SYSTEM_CONFIG: /app/configs/maintenance_request.yaml
      AGENT_NAME: compliance-rag
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seed-compliance:
        condition: service_completed_successfully

  maintenance-planner:
    <<: *agent-common
    profiles: ["maintenance"]
    environment:
      <<: *agent-env
      SYSTEM_CONFIG: /app/configs/maintenance_request.yaml
      AGENT_NAME: maintenance-planner
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
