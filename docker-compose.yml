name: agentmesh

x-agent-env: &agent-env
  SYSTEM_CONFIG: /app/configs/${SYSTEM_CONFIG_FILE:-incident_triage.yaml}
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

x-agent-common: &agent-common
  build: .
  image: agentmesh/agent:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/healthy && find /tmp/healthy -newermt '-30 seconds' | grep -q ."]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  depends_on:
    nats:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
    jaeger:
      condition: service_healthy

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seed:
    build: .
    image: agentmesh/agent:latest
    entrypoint: ["python", "scripts/seed_runbooks.py"]
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  parser:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: parser
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  rag:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: rag
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  executor:
    <<: *agent-common
    environment:
      <<: *agent-env
      AGENT_NAME: executor
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  summarizer:
    <<: *agent-common
    profiles: ["with-summary"]
    environment:
      <<: *agent-env
      AGENT_NAME: summarizer
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      jaeger:
        condition: service_healthy
