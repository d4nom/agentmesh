system: incident-triage-chaos
llm:
  provider: ${LLM_PROVIDER:-mock}
  model: deepseek-chat
agents:
  - name: parser
    module: agents.parser:ParserAgent
    subscribes: tasks.parse
    publishes: [tasks.retrieve]
    stores: [redis]
  - name: rag
    module: agents.rag:RagAgent
    subscribes: tasks.retrieve
    publishes: [tasks.execute]
    stores: [redis, qdrant]
    params:
      collection: runbooks
      top_k: 3
  - name: executor
    module: agents.executor:ExecutorAgent
    subscribes: tasks.execute
    publishes: [events.incident.completed]
    stores: [redis]
    params:
      dry_run: true
      # Gives scripts/chaos.sh a deterministic window in which to kill the
      # process after handle() starts but before it can publish/ack.
      processing_delay_seconds: 10
