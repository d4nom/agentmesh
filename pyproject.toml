[project]
name = "agentmesh"
version = "0.1.0"
description = "Infrastructure platform for building distributed multi-agent systems of arbitrary configuration"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7.2",
    "redis>=5.0.8",
    "qdrant-client>=1.18.0,<1.19.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "structlog>=24.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "fastembed>=0.3.6",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: integration tests that require a running docker compose stack",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_core", "agents"]
